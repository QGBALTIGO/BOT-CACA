name: Public catalog probe
on:
  push:
    paths:
      - '.github/workflows/public-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect documented public feed and sample ebook
        run: |
          mkdir -p public-catalog
          python3 - <<'PY'
          import json, pathlib, time, urllib.request, urllib.error
          targets = {
              'gutenberg-search.xml': 'https://www.gutenberg.org/ebooks/search.opds/?query=Dom%20Casmurro',
              'gutenberg-55752.rdf': 'https://www.gutenberg.org/cache/epub/55752/pg55752.rdf',
              'gutenberg-55752.txt': 'https://www.gutenberg.org/cache/epub/55752/pg55752.txt',
          }
          report = []
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          for name, url in targets.items():
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'LivrosBaltigo/0.5 public-catalog-check'})
                  with opener.open(request, timeout=25) as response:
                      data = response.read(2000001)
                      if len(data) > 2000000:
                          raise ValueError('response_too_large')
                      pathlib.Path('public-catalog', name).write_bytes(data)
                      report.append({'file':name,'status':response.status,'bytes':len(data),'content_type':response.headers.get('Content-Type')})
              except urllib.error.HTTPError as exc:
                  report.append({'file':name,'status':exc.code,'error':'http_error'})
              except Exception as exc:
                  report.append({'file':name,'error':type(exc).__name__})
              time.sleep(2)
          pathlib.Path('public-catalog/report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-catalog-responses
          path: public-catalog/
          retention-days: 3
